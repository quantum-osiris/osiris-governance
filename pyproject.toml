[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "osiris-governance"
version = "0.1.0-reference"
description = "Deterministic, side-effect-free replay proof core for OSIRIS Governance"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
osiris-governance = "osiris_governance.cli:main"

